<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Get HITCH</title>
<style>
:root{--bg:#F6F1E7;--fg:#0B1A1F;--muted:#4a5a5e;--brand:#0E5A5F;--accent:#B07D22;--card:#fffdf8;--line:#ddd3bd}
@media (prefers-color-scheme:dark){:root{--bg:#0B1A1F;--fg:#F6F1E7;--muted:#a9b8b8;--brand:#5fb7b9;--accent:#D9A441;--card:#112a30;--line:#24444b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:linear-gradient(135deg,#11696E,#083C40);color:#F6F1E7;padding:40px 20px 32px}
header .in,main{max-width:760px;margin:0 auto}
header h1{margin:0 0 6px;font:900 clamp(2rem,6vw,2.8rem)/1.1 Georgia,"Times New Roman",serif;letter-spacing:.02em}
header p{margin:0;color:#D9A441}
main{padding:24px 20px 64px}
h2{font:700 1.4rem/1.3 Georgia,"Times New Roman",serif;color:var(--brand);margin:2rem 0 .4rem;padding-bottom:.25rem;border-bottom:2px solid var(--accent)}
a{color:var(--brand)}
ul{padding-left:1.2rem}li{margin:.3rem 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:1rem 0}
footer{color:var(--muted);font-size:.9rem;text-align:center;padding:0 20px 40px}
.icon{width:96px;height:96px;border-radius:22px;display:block;margin:0 0 16px}
.chain{font:700 1.05rem/1.6 ui-monospace,Menlo,monospace;letter-spacing:.04em}
</style>
</head>
<body>
<header><div class="in"><img class="icon" src="icon.png" alt="HITCH app icon" width="96" height="96"><h1>HITCH</h1><p>The daily word-chain puzzle</p></div></header>
<main>

<p id="status">One word-chain puzzle a day. Link the words, reveal as few letters as you can.</p>
<p class="card" id="links">HITCH is coming soon to the App Store and Google Play.</p>
<p><a href="./">About HITCH</a></p>

</main>
<footer>&copy; 2026 PSU Pro, LLC &middot; <a href="./">Home</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a></footer>
<script>
// Shared results link here. Each visitor is sent to the store for their own phone.
// A store's address stays null until HITCH is live there; set it on the day that store approves the app.
//   ios:     'https://apps.apple.com/app/id6821472371'
//   android: 'https://play.google.com/store/apps/details?id=com.psupro.hitch'
var STORES = { ios: null, android: null };

var ua = navigator.userAgent || '';
var isApple = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
var mine = isApple ? STORES.ios : /Android/.test(ua) ? STORES.android : null;
if (mine) {
  location.replace(mine);
} else {
  var out = [];
  if (STORES.ios) out.push('<a href="' + STORES.ios + '">Download on the App Store</a>');
  if (STORES.android) out.push('<a href="' + STORES.android + '">Get it on Google Play</a>');
  if (out.length) document.getElementById('links').innerHTML = out.join(' &middot; ');
}
</script>
</body>
</html>
